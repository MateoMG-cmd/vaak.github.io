var MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var WEEKDAYS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];

function pad(n){ return String(n).padStart(2,"0"); }
function int(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
function compact(n){
  var a = Math.abs(n);
  if (a >= 1e6) return (n/1e6).toFixed(2).replace(".",",") + " M";
  if (a >= 1e4) return (n/1e3).toFixed(1).replace(".",",") + " k";
  if (a >= 1e3) return (n/1e3).toFixed(2).replace(".",",") + " k";
  return int(n);
}
function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }
function utcClock(input){ var d = new Date(input); return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())+":"+pad(d.getUTCSeconds()); }
function utcClockShort(input){ var d = new Date(input); return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes()); }
function utcStamp(input){ var d = new Date(input); return pad(d.getUTCDate())+" "+MONTHS[d.getUTCMonth()]+" · "+utcClockShort(d)+" UTC"; }
function shortDate(input){ var d = new Date(input); return pad(d.getUTCDate())+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function longDate(input){ var d = new Date(input); return WEEKDAYS[d.getUTCDay()]+" "+d.getUTCDate()+" de "+MONTHS[d.getUTCMonth()]+" de "+d.getUTCFullYear(); }
function toLocalInput(iso){
  var d = new Date(iso);
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function countdown(target, now){
  var delta = new Date(target).getTime() - now;
  if (delta <= 0) return "disponible";
  var days = Math.floor(delta/86400000);
  var hours = Math.floor((delta%86400000)/3600000);
  var mins = Math.floor((delta%3600000)/60000);
  if (days > 0) return days+" d "+pad(hours)+" h";
  if (hours > 0) return hours+" h "+pad(mins)+" min";
  return mins+" min";
}

var STORE_KEY = "vaak.outbreak.data.v1";
var clone = function(o){ return JSON.parse(JSON.stringify(o)); };

var DB = {
  data: null,
  load: function(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.streamers && parsed.phases && parsed.lore && parsed.event) return parsed;
      }
    }catch(e){ console.warn("Datos guardados ilegibles, se restauran los de fábrica", e); }
    return clone(DEFAULT_DATA);
  },
  save: function(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB.data)); }
    catch(e){ console.warn("No se pudo guardar en localStorage", e); }
  },
  init: function(){ DB.data = DB.load(); DB.save(); },
  reset: function(){ DB.data = clone(DEFAULT_DATA); DB.save(); }
};

var $ = function(sel, root){ return (root||document).querySelector(sel); };
var $$ = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };

function esc(value){
  return String(value === undefined || value === null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function platformLabel(p){
  return p === "twitch" ? "Twitch" : p === "youtube" ? "YouTube" : "Kick";
}
function statusLabel(s){
  return s === "live" ? "En directo" : s === "eliminated" ? "Retirado" : "Fuera de línea";
}
function statusClass(s){
  return s === "live" ? "badge-live" : s === "eliminated" ? "badge-copper" : "badge-muted";
}

/** Placa topográfica generada: no hay imágenes de relleno ni peticiones de red. */
function plate(seat, dimmed){
  var ox = 44 + ((seat*37) % 232);
  var oy = 34 + ((seat*23) % 96);
  var rot = ((seat*13) % 40) - 20;
  var curves = "";
  for (var i = 0; i < 11; i++){
    curves += '<ellipse cx="'+ox+'" cy="'+oy+'" rx="'+(18+i*26)+'" ry="'+(9+i*12)+'" opacity="'+Math.max(0.16,1-i*0.075).toFixed(2)+'" transform="rotate('+rot+' '+ox+' '+oy+')"/>';
  }
  return '<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">'
    + '<rect width="320" height="180" fill="#000"/>'
    + '<g fill="none" stroke="#333336" stroke-width="1" opacity="'+(dimmed?0.45:1)+'">'+curves+'</g>'
    + '<line x1="0" y1="118" x2="320" y2="118" stroke="rgb(40 40 40)" stroke-width="1" opacity="'+(dimmed?0.5:1)+'"/>'
    + '<line x1="196" y1="0" x2="196" y2="180" stroke="rgb(40 40 40)" stroke-width="1" opacity="'+(dimmed?0.5:1)+'"/>'
    + '<circle cx="'+ox+'" cy="118" r="2.5" fill="'+(dimmed?"#333336":"#f5f5f7")+'" opacity="'+(dimmed?0.6:0.85)+'"/>'
    + '</svg>';
}

function difficultyMeter(value, large){
  var seg = "";
  for (var i = 1; i <= 5; i++){
    seg += '<span class="difficulty-segment" data-on="'+(i <= value)+'"'+(large?' style="width:24px;height:4px"':'')+'></span>';
  }
  return '<span class="difficulty-meter" role="img" aria-label="Dificultad '+value+' de 5">'+seg+'</span>';
}

function activePhase(){
  var now = state.now;
  for (var i = 0; i < DB.data.phases.length; i++){
    var p = DB.data.phases[i];
    if (now >= Date.parse(p.startsAt) && now < Date.parse(p.endsAt)) return p;
  }
  return null;
}

function phaseState(phase){
  if (state.now >= Date.parse(phase.endsAt)) return "completed";
  if (state.now >= Date.parse(phase.startsAt)) return "active";
  return "upcoming";
}
var PHASE_STATE_LABEL = { completed:"Superada", active:"En curso", upcoming:"Proxima" };

function dayIndex(){
  var start = Date.parse(DB.data.event.startedAt);
  return clamp(Math.floor((state.now - start) / 86400000) + 1, 1, DB.data.event.totalDays);
}

function activeStreamer(){
  for (var i = 0; i < DB.data.streamers.length; i++){
    if (DB.data.streamers[i].id === state.activeId) return DB.data.streamers[i];
  }
  return DB.data.streamers[0];
}

function fallbackStreamer(){
  for (var i = 0; i < DB.data.streamers.length; i++){
    var s = DB.data.streamers[i];
    if (s.status === "live" && s.id !== state.activeId) return s;
  }
  return DB.data.streamers[0];
}

function tally(){
  var t = { total:DB.data.streamers.length, live:0, offline:0, eliminated:0, concurrent:0 };
  DB.data.streamers.forEach(function(s){
    if (s.status === "live") t.live += 1;
    else if (s.status === "offline") t.offline += 1;
    else t.eliminated += 1;
    t.concurrent += s.viewers || 0;
  });
  return t;
}

function embedUrl(streamer){
  if (!streamer.embed) return "";
  return streamer.embed
    .replace("{channel}", encodeURIComponent(streamer.channel || ""))
    .replace("{host}", encodeURIComponent(location.hostname || "localhost"));
}

var TARGET_LABEL = { conditions:"Condiciones", environment:"Entorno", creatures:"Fauna", limits:"Limitaciones" };

function modifierGroup(title, note, list){
  var ordered = list.slice().sort(function(a,b){ return rank(b.severity) - rank(a.severity); });
  return '<div>'
    + '<div class="row-between" style="border-bottom:1px solid var(--color-keyline);padding-bottom:1rem"><h3 style="font-size:15px;font-weight:600">'+esc(title)+'</h3><span class="label-micro" style="color:var(--color-steel)">'+esc(note)+'</span></div>'
    + '<ul class="stack stack-4 mt-4">'
    + ordered.map(function(m){
        var tone = (m.severity === "alta" || m.severity === "extrema") ? "label-copper" : "";
        return '<li class="stack" style="gap:.375rem">'
          + '<div class="row-between"><span style="font-size:15px;font-weight:500">'+esc(m.label)+'</span>'
          + '<span class="label-micro '+tone+'" style="flex:none">'+esc(m.severity)+'</span></div>'
          + '<p class="text-meta">'+esc(m.detail)+'</p></li>';
      }).join("")
    + '</ul></div>';
}

function rank(sev){ return { baja:1, media:2, alta:3, extrema:4 }[sev] || 0; }

function renderPhases(){
  var phases = DB.data.phases;

  for (var i = 0; i < phases.length; i++){
    if (phases[i].id === state.phaseId) current = phases[i];
  }
  if (!current) current = phases[0];

  var tabs = phases.map(function(p){
    var st = phaseState(p);
    return '<button role="tab" id="tab-'+esc(p.id)+'" aria-selected="'+(p.id === current.id)+'" aria-controls="panel-fase" tabindex="'+(p.id === current.id ? "0" : "-1")+'" data-action="phase" data-id="'+esc(p.id)+'" style="position:relative;flex:1 0 auto;min-width:150px;text-align:left">'
      + '<span aria-hidden="true" style="position:absolute;left:0;right:0;top:11px;height:1px;background:var(--color-keyline)"></span>'
      + '<span aria-hidden="true" style="position:relative;display:block;width:9px;height:9px;border-radius:9999px;margin-top:7px;background:'+(st === "upcoming" ? "#000" : "var(--color-porcelain)")+';box-shadow:inset 0 0 0 1px '+(st === "upcoming" ? "var(--color-steel)" : "transparent")+'"></span>'

      + '<span class="label-micro" style="'+(p.id === current.id ? "color:var(--color-porcelain)" : "")+'">Semana '+p.week+'</span>'
      + '<span style="font-size:15px;font-weight:600;letter-spacing:-.011em;color:'+(p.id === current.id ? "var(--color-porcelain)" : "var(--color-ash)")+'">'+esc(p.title)+'</span>'
      + difficultyMeter(p.difficulty)
      + '<span class="label-micro" style="color:var(--color-steel)">'+PHASE_STATE_LABEL[st]+'</span>'
      + '</span></button>';
  }).join("");

  var c = current.conditions;
  var st = phaseState(current);
  var patches = (current.patches || []).slice().sort(function(a,b){ return Date.parse(b.appliedAt) - Date.parse(a.appliedAt); });

  var patchBlock = patches.length

      + '<p class="text-meta mt-3 max-w-72ch">El comité cambia las reglas con la temporada en marcha. Cada cambio queda anotado con su motivo.</p>'
      + '<ol class="stack stack-4 mt-6">' + patches.map(function(p){
          return '<li class="panel-inner" style="padding:1.25rem">'
            + '<div class="row" style="gap:.75rem"><span class="label-copper">'+esc(p.code)+'</span>'
            + '<span class="label-micro" style="color:var(--color-slate)">'+esc(TARGET_LABEL[p.target] || p.target)+'</span>'
            + '<span class="label-micro" style="color:var(--color-steel)">'+esc(utcStamp(p.appliedAt))+'</span></div>'
            + '<p class="mt-3" style="font-size:15px;font-weight:600">'+esc(p.summary)+'</p>'
            + '<p class="text-meta mt-2">'+esc(p.detail)+'</p>'
            + '<p class="text-meta mt-3" style="padding-top:.75rem;border-top:1px solid var(--color-keyline);color:var(--color-slate)"><span style="color:var(--color-porcelain)">Motivo:</span> '+esc(p.reason)+'</p>'
            + '<p class="label-micro mt-2" style="color:var(--color-steel)">'+esc(p.author)+'</p></li>';
        }).join("") + '</ol></div>'
    : "";

  $("#view-fases").innerHTML =
    '<section class="band" style="border-bottom:1px solid var(--color-keyline)">'
  + '<div class="shell-wide">'
  +  '<p class="label-copper">Sistema de dificultad</p>'
  +  '<h1 class="text-display mt-5" style="max-width:18ch">Lo que cambia cada semana y lo que deja de estar permitido.</h1>'
  +  '<p class="text-lead mt-6 max-w-72ch">El sistema está publicado entero, incluidas las fases que aún no han empezado. Lo que está en esta página es exactamente lo que se aplica dentro de la VAAK-07.</p>'
  +  '<div class="row mt-8">'
  +    '<span class="badge badge-live"><span class="live-dot"></span>'+(activePhase() ? "Semana "+activePhase().week+" en curso" : "Fuera de temporada")+'</span>'
  +    '<a class="pill pill-sm pill-primary" href="#/">Volver al directo</a>'
  +  '</div>'
  + '</div></section>'
  + '<section class="band deferred">'
  + '<div class="shell-wide">'
  +  '<div style="overflow-x:auto;scrollbar-width:none"><div role="tablist" aria-label="Semanas de la temporada" style="display:flex;gap:1.5rem;min-width:760px;padding-right:1rem">'+tabs+'</div></div>'
  +  '<div id="panel-fase" role="tabpanel" aria-labelledby="tab-'+esc(current.id)+'" tabindex="0" class="panel-carbon mt-8" style="padding:1.5rem">'
  +   '<div class="row" style="gap:.75rem">'
  +     '<span class="badge '+(st === "active" ? "badge-live" : st === "completed" ? "" : "badge-muted")+'">'+(st === "completed" ? "Superada" : PHASE_STATE_LABEL[st])+'</span>'
  +     '<span class="label-micro">Días '+current.dayRange[0]+"–"+current.dayRange[1]+' · '+shortDate(current.startsAt)+" — "+shortDate(current.endsAt)+'</span>'
  +     '<span class="row" style="margin-left:auto;gap:.75rem"><span class="label-micro">Dificultad</span>'+difficultyMeter(current.difficulty, true)+'</span>'
  +   '</div>'
  +   '<h2 class="text-display mt-6">'+esc(current.title)+'</h2>'
  +   '<p class="text-lead mt-3">'+esc(current.subtitle)+'</p>'
  +   '<p class="text-body mt-6 max-w-72ch" style="color:var(--color-slate)">'+esc(current.summary)+'</p>'
  +   '<div class="grid-auto grid-auto-4 mt-10">'
  +     measure("Viento sostenido", c.wind + " km/h", "sin corriente")
  +     measure("Temperatura mínima", c.temperature + c.unit, c.tempNote)
  +     measure("Luz diurna", c.daylight, "por jornada")
  +     measure("Oxígeno por persona", c.oxygen + " min", "de aire limpio")
  +   '</div>'
  +   '<div class="grid-auto grid-auto-3 mt-12">'
  +     modifierGroup("Modificadores de entorno", "Lo que hace el sistema.", current.environment)

  + '</div></section>';
}

function measure(label, value, unit){
  return '<div class="measure">'
    + '<span class="label-micro">'+esc(label)+'</span>'

function entryUnlocked(entry, now){ return Date.parse(entry.unlockAt) <= now; }

function renderLore(){
  var entries = DB.data.lore.slice().sort(function(a,b){ return Date.parse(b.recordedAt) - Date.parse(a.recordedAt); });
  var weeks = entries.map(function(e){ return e.week; }).filter(function(w,i,a){ return a.indexOf(w) === i; }).sort();
  var published = entries.filter(function(e){ return entryUnlocked(e, state.now); }).length;

  var visible = state.loreFilter === "all" ? entries
    : state.loreFilter === "published" ? entries.filter(function(e){ return entryUnlocked(e, state.now); })
    : entries.filter(function(e){ return e.week === Number(state.loreFilter); });

  var filters = [{ id:"all", label:"Todas" }, { id:"published", label:"Publicadas" }]
    .concat(weeks.map(function(w){ return { id:String(w), label:"Semana "+w }; }))
    .map(function(f){
      var count = f.id === "all" ? entries.length
        : f.id === "published" ? published
        : entries.filter(function(e){ return e.week === Number(f.id); }).length;
      return '<button class="filter-chip" data-action="lore-filter" data-id="'+f.id+'" aria-pressed="'+(state.loreFilter === f.id)+'">'+f.label+' <span class="filter-chip-count">'+count+'</span></button>';
    }).join("");

  var cards = visible.map(function(entry){
    var open = entryUnlocked(entry, state.now);
    var isOpen = state.openEntry === entry.id;
    var head =
      '<div class="row-between" style="padding:1.25rem">'
      + '<div style="min-width:0"><p class="row" style="gap:.75rem">'
      + '<span class="label-micro" style="color:var(--color-porcelain)">'+esc(entry.title)+'</span>'
      + '<span class="label-copper">'+esc(entry.classification)+'</span></p>'
      + '<p class="text-meta mt-2">'+esc(entry.author)+' · Semana '+entry.week+' · Grabada el '+shortDate(entry.recordedAt)+'</p></div>'
      + '<div class="row">'
      + (open
          ? '<span class="label-micro row" style="gap:.375rem"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 7.7-1.6"/></svg>Publicada</span>'
          : '<span class="label-copper row" style="gap:.375rem"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>'+countdown(entry.unlockAt, state.now)+'</span>')
      + '<button class="filter-chip" data-action="lore-open" data-id="'+esc(entry.id)+'" aria-expanded="'+isOpen+'" aria-controls="entrada-'+esc(entry.id)+'" style="width:36px;padding:0;justify-content:center" aria-label="'+(isOpen ? "Contraer" : "Expandir")+' '+esc(entry.title)+'">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="transform:rotate('+(isOpen ? 180 : 0)+'deg);transition:transform .2s" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>'
      + '</div></div>';

    var body;
    if (!isOpen){
      body = '<div id="entrada-'+esc(entry.id)+'" hidden></div>';
    } else if (open){
      body = '<div id="entrada-'+esc(entry.id)+'" style="padding:1.25rem"><ol class="stack" style="gap:.375rem">'
        + entry.lines.map(function(line){
            var parts = line.split(/\s{2,}/);
            var stamp = parts.shift();
            return '<li class="terminal-line"><span class="terminal-time">'+esc(stamp)+'</span> <span style="color:var(--color-porcelain)">'+esc(parts.join(" "))+'</span></li>';
          }).join("")
        + '</ol></div>';
    } else {
      body = '<div id="entrada-'+esc(entry.id)+'" style="padding:1.25rem">'
        + '<p class="label-micro row" style="gap:.5rem;color:var(--color-steel)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7.5 10 2.5 2-2.5 2M13 14.5h4"/></svg>Contenido retenido hasta '+esc(utcStamp(entry.unlockAt))+'</p>'
        + '<div aria-hidden="true" class="stack mt-4" style="gap:.75rem">'
        + entry.lines.map(function(line){ return '<p class="pixelated terminal-line">'+esc(line)+'</p>'; }).join("")
        + '</div>'
        + '<p class="text-meta mt-4" style="color:var(--color-slate)">El registro permanece cifrado hasta su publicación.</p></div>';
    }

    return '<li class="terminal" style="overflow:hidden">'+head+body+'</li>';
  }).join("");

  $("#view-lore").innerHTML =
    '<section class="band" style="border-bottom:1px solid var(--color-keyline)">'
  + '<div class="shell-wide">'
  +  '<p class="row" style="gap:.75rem"><span class="label-copper">Registro de supervivencia</span><span class="brand-sep"></span><span class="label-copper">'+esc(DB.data.event.classification)+'</span></p>'
  +  '<h1 class="text-display mt-6" style="max-width:16ch">Lo que se escribió antes de que nadie pudiera contarlo.</h1>'
  +  '<p class="text-lead mt-6 max-w-72ch">Cada bitácora se publica con 48 horas de retraso. Las anteriores al cierre de la fase quedan cifradas hasta la apertura de la siguiente.</p>'
  +  '<div class="row mt-8"><span class="badge">'+published+" publicadas · "+(entries.length - published)+" retenidas</span>"
  +  '<a class="pill pill-sm pill-primary" href="#/">Volver al directo</a></div>'
  + '</div></section>'
  + '<section class="band deferred">'
  + '<div class="shell-wide">'
  +  '<div class="row-between"><p class="label-micro">'+published+' de '+entries.length+' entradas publicadas</p>'
  +  '<div class="row" role="group" aria-label="Filtrar bitácoras">'+filters+'</div></div>'
  +  '<ol class="stack mt-8" style="gap:1.25rem">' + (cards || '<li class="text-body" style="color:var(--color-ash)">No hay entradas con ese filtro.</li>') + '</ol>'
  +  '<div class="notice mt-12 stack">'
  +    '<p class="label-micro">Procedencia y honestidad</p>'
  +    '<p class="text-body" style="color:var(--color-ash)">Las bitácoras se transcriben desde la grabación del casco de cada participante. El pixelado es una convención visual, no un cifrado: el texto retenido sigue en el archivo. Si algún día hay material real, esto tiene que salir del HTML público y servirse desde una ruta autenticada.</p>'
  +  '</div>'
  + '</div></section>';
}

/* ==========================================================================
   11. VALIDACIÓN DE ESCRITURAS
   Lo que se guarda vuelve a pintar las tres vistas públicas, así que un
   error aquí rompería el sitio entero. Se comprueba antes de escribir.
   ========================================================================== */
var EMBED_HOSTS = ["player.kick.com","player.twitch.tv","www.youtube.com","www.youtube-nocookie.com"];

function validate(form){
  var d = {};
  var invalid = [];
  form.querySelectorAll("input,select,textarea").forEach(function(el){
    d[el.name] = el.value;
    if (el.getAttribute("aria-invalid") === "true") invalid.push(el.name);
  });
  if (invalid.length) return { ok:false, message:"Revisa los campos marcados.", invalid:invalid };

  if (d.watch && !/^https:\/\//.test(d.watch)) return { ok:false, message:"La URL del canal debe empezar por https." };
  if (d.chat && !/^https:\/\//.test(d.chat)) return { ok:false, message:"La URL del chat debe empezar por https." };
  if (d.embed){
    try{
      var u = new URL(d.embed);
      if (u.protocol !== "https:") return { ok:false, message:"La plantilla del player debe usar https." };
      if (EMBED_HOSTS.indexOf(u.hostname) === -1) return { ok:false, message:"El player debe ser de Kick, Twitch o YouTube." };
    }catch(e){ return { ok:false, message:"La plantilla del player no es una URL válida." }; }
  }
  if (d.name !== undefined && !String(d.name).trim()) return { ok:false, message:"El nombre no puede quedar vacío." };
  if (d.seat !== undefined && (!/^\d+$/.test(d.seat) || Number(d.seat) < 1)) return { ok:false, message:"El asiento debe ser un número entero positivo." };
  if (d.viewers !== undefined && !/^\d+$/.test(d.viewers)) return { ok:false, message:"Los espectadores deben ser un número entero." };
  if (d.recordedAt && d.unlockAt && new Date(d.unlockAt) < new Date(d.recordedAt)) return { ok:false, message:"La publicación no puede ser anterior a la grabación." };
  if (d.lines !== undefined && !String(d.lines).trim()) return { ok:false, message:"La bitácora necesita al menos una línea." };
  if (d.summary !== undefined && !String(d.summary).trim()) return { ok:false, message:"El parche necesita un titular." };
  if (d.reason !== undefined && !String(d.reason).trim()) return { ok:false, message:"El parche necesita un motivo." };
  return { ok:true, data:d };
}

function markInvalid(form, names){
  form.querySelectorAll("input,select,textarea").forEach(function(el){
    if (names.indexOf(el.name) !== -1) el.setAttribute("aria-invalid","true");
  });
}

function toast(message, tone){
  var el = document.createElement("div");
  el.setAttribute("role","status");
  el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;padding:.75rem 1.25rem;border-radius:9999px;font-size:.8125rem;max-width:calc(100vw - 32px)"
    + (tone === "error"
      ? "background:rgb(220 38 38 / .16);border:1px solid rgb(220 38 38 / .5);color:var(--color-blood)"
      : "background:var(--color-graphite);border:1px solid var(--color-keyline-strong);color:var(--color-porcelain)");
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

function route(){
  var hash = (location.hash || "#/").replace(/^#\/?/, "");
  var view = hash.split("/")[0] || "hub";
  if (["hub","fases","lore","admin"].indexOf(view) === -1) view = "hub";
  state.view = view;
  state.playing = false;
  state.chatLoaded = false;

  ["hub","fases","lore","admin"].forEach(function(v){
    $("#view-" + v).hidden = v !== view;
  });
  $$(".nav-link").forEach(function(a){
    if (a.dataset.route === view) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  $("#menu-panel").hidden = true;
  $("#menu-toggle").setAttribute("aria-expanded","false");

  render();
  window.scrollTo(0, 0);
}

function render(){
  renderChrome();
  if (state.view === "hub") renderHub();
  if (state.view === "fases") renderPhases();
  if (state.view === "lore") renderLore();
  if (state.view === "admin") renderAdmin();
}

function wireAdmin(){
  $$("#view-admin form").forEach(function(form){
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var kind = form.dataset.action;

      if (kind === "admin-login"){
        if (form.password.value !== ADMIN_PASSWORD){
          var err = form.querySelector("[data-login-error]");
          if (err) err.hidden = false;
          return;
        }
        state.adminAuth = true;
        renderAdmin();
        return;
      }

      var result = validate(form);
      if (!result.ok){
        if (result.invalid) markInvalid(form, result.invalid);
        toast(result.message, "error");
        return;
      }

      if (kind === "admin-save-streamer"){
        var s = DB.data.streamers.filter(function(x){ return x.id === result.data.id; })[0];
        if (!s) return toast("Ese canal ya no existe.", "error");
        s.name = result.data.name.trim();
        s.handle = result.data.handle.trim() || "@" + result.data.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"");
        s.platform = result.data.platform;
        s.status = result.data.status;
        s.role = result.data.role.trim();
        s.team = result.data.team.trim();
        s.seat = Number(result.data.seat);
        s.viewers = Number(result.data.viewers);
        s.total = Number(result.data.total);
        s.channel = result.data.channel.trim();
        s.embed = result.data.embed.trim();
        s.watch = result.data.watch.trim();
        s.chat = result.data.chat.trim();
        s.statusNote = result.data.statusNote.trim();
        if (s.status === "live" && s.viewers === 0){
          return toast("Un canal en directo no puede declarar 0 espectadores.", "error");
        }
        DB.save();
        toast("Canal guardado.");
      }

      if (kind === "admin-save-phase"){
        var p = DB.data.phases.filter(function(x){ return x.id === result.data.id; })[0];
        if (!p) return toast("Esa fase ya no existe.", "error");
        p.title = result.data.title.trim();
        p.subtitle = result.data.subtitle.trim();
        p.summary = result.data.summary.trim();
        p.comparedTo = result.data.comparedTo.trim();
        p.difficulty = Number(result.data.difficulty);
        p.conditions.temperature = result.data.temperature.trim();
        p.conditions.oxygen = Number(result.data.oxygen);
        p.conditions.charges = Number(result.data.charges);
        p.conditions.daylight = result.data.daylight.trim();
        DB.save();
        toast("Fase guardada.");
      }

      if (kind === "admin-add-patch"){
        var target = DB.data.phases.filter(function(x){ return x.id === result.data.phaseId; })[0];
        if (!target) return toast("Esa fase ya no existe.", "error");
        target.patches = target.patches || [];
        target.patches.push({
          id:"patch-" + Date.now(),
          code: result.data.code.trim() || "P-" + String(target.patches.length + 1).padStart(2,"0"),
          author: result.data.author.trim(),
          appliedAt: new Date().toISOString(),
          target: result.data.target,
          severity: result.data.severity,
          summary: result.data.summary.trim(),
          detail: result.data.detail.trim(),
          reason: result.data.reason.trim()
        });
        DB.save();
        toast("Parche aplicado.");
      }

      if (kind === "admin-save-lore"){
        var e = DB.data.lore.filter(function(x){ return x.id === result.data.id; })[0];
        if (!e) return toast("Esa bitácora ya no existe.", "error");
        e.title = result.data.title.trim();
        e.author = result.data.author.trim();
        e.week = Number(result.data.week);
        e.classification = result.data.classification.trim();
        e.recordedAt = new Date(result.data.recordedAt).toISOString();
        e.unlockAt = new Date(result.data.unlockAt).toISOString();
        e.lines = result.data.lines.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
        DB.save();
        toast("Bitácora guardada.");
      }

      render();
    });
  });
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;

  if (action === "play"){ state.playing = true; renderHub(); return; }

  if (action === "switch"){
    state.activeId = el.dataset.id;
    state.playing = false;
    state.chatLoaded = false;
    state.chatTab = "chat";
    renderHub();
    return;
  }

  if (action === "chat-tab"){ state.chatTab = el.dataset.tab; renderHub(); return; }
  if (action === "chat-load"){ state.chatLoaded = true; renderHub(); return; }
  if (action === "filter"){ state.filterStreamers = el.dataset.id; renderHub(); return; }
  if (action === "phase"){ state.phaseId = el.dataset.id; renderPhases(); return; }
  if (action === "lore-filter"){ state.loreFilter = el.dataset.id; renderLore(); return; }
  if (action === "lore-open"){
    state.openEntry = state.openEntry === el.dataset.id ? null : el.dataset.id;
    renderLore();
    return;
  }

  if (action === "admin-tab"){ state.adminTab = el.dataset.id; state.editId = null; renderAdmin(); return; }
  if (action === "admin-edit"){ state.editId = el.dataset.id; renderAdmin(); return; }

  if (action === "admin-del-streamer"){
    if (DB.data.streamers.length <= 1) return toast("No se puede borrar el último canal.", "error");
    var confirmDel = window.confirm("¿Retirar este canal del directorio?");
    if (!confirmDel) return;
    DB.data.streamers = DB.data.streamers.filter(function(x){ return x.id !== el.dataset.id; });
    state.editId = null;
    state.activeId = DB.data.streamers[0].id;
    DB.save();
    render();
    toast("Canal retirado.");
    return;
  }

  if (action === "admin-del-patch"){
    var ph = DB.data.phases.filter(function(x){ return x.id === el.dataset.phase; })[0];
    if (!ph) return;
    ph.patches = (ph.patches || []).filter(function(x){ return x.id !== el.dataset.id; });
    DB.save();
    render();
    toast("Parche retirado.");
    return;
  }

  if (action === "admin-del-lore"){
    if (DB.data.lore.length <= 1) return toast("Debe quedar al menos una bitácora.", "error");
    if (!window.confirm("¿Borrar esta bitácora del registro?")) return;
    DB.data.lore = DB.data.lore.filter(function(x){ return x.id !== el.dataset.id; });
    state.editId = null;
    DB.save();
    render();
    toast("Bitácora retirada.");
    return;
  }

  if (action === "admin-export"){
    var blob = new Blob([JSON.stringify(DB.data, null, 2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "vaak-outbreak.data.json";
    a.click();
    URL.revokeObjectURL(url);
    toast("JSON descargado. Súbelo al repositorio para publicarlo.");
    return;
  }

  if (action === "admin-import"){ $("#admin-file").click(); return; }

  if (action === "admin-reset"){
    if (!window.confirm("¿Restaurar el contenido de fábrica? Se pierden los cambios de este navegador.")) return;
    DB.reset();
    state.editId = null;
    render();
    toast("Contenido restaurado.");
  }
});

document.addEventListener("change", function(ev){
  if (ev.target.id === "admin-file" && ev.target.files[0]){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.streamers || !parsed.phases || !parsed.lore || !parsed.event) {
          throw new Error("Faltan bloques obligatorios");
        }
        DB.data = parsed;
        DB.save();
        state.editId = null;
        render();
        toast("Datos importados.");
      }catch(err){
        toast("El archivo no tiene la forma esperada: " + err.message, "error");
      }
    };
    reader.readAsText(ev.target.files[0]);
    ev.target.value = "";
  }
});

$("#menu-toggle").addEventListener("click", function(){
  var panel = $("#menu-panel");
  panel.hidden = !panel.hidden;
  this.setAttribute("aria-expanded", String(!panel.hidden));
});

/* ==========================================================================
   13. REVELADO AL HACER SCROLL
   Un solo observador para toda la página.
   ========================================================================== */
var revealObserver = null;
if ("IntersectionObserver" in window){
  revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting){
        entry.target.dataset.visible = "true";
        revealObserver.unobserve(entry.target);
      }
    });
  }, { rootMargin:"0px 0px -10% 0px", threshold:0.06 });
}

function applyReveal(root){
  if (!revealObserver) return;
  var nodes = $$(".reveal:not([data-seen])", root || document);
  nodes.forEach(function(node){
    node.dataset.seen = "1";
    if (node.getBoundingClientRect().top < window.innerHeight * 0.94){
      node.dataset.visible = "true";
      return;
    }
    revealObserver.observe(node);
  });
}

/* ==========================================================================
   14. GOTEO DE SANGRE EN CANVAS
  Ligero por construcción: pocos gotas, radios limitados y apagado por debajo
   de 768px o cuando la pestaña no está visible.
   ========================================================================== */
var blood = {
  canvas: $("#blood"),
  ctx: null,
  drops: [],
  raf: 0,
  running: false,

  init: function(){
    this.ctx = this.canvas.getContext("2d", { alpha:true });
    this.resize();
    this.sync();
    window.addEventListener("resize", function(){ blood.resize(); blood.sync(); });
    document.addEventListener("visibilitychange", function(){ blood.sync(); });
    this.loveReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  },

  allowed: function(){
    return window.innerWidth >= 768 && !this.loveReduced && document.visibilityState === "visible";
  },

  resize: function(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.floor(window.innerWidth * dpr);
    this.canvas.height = Math.floor(window.innerHeight * dpr);
    this.canvas.style.width = window.innerWidth + "px";
    this.canvas.style.height = window.innerHeight + "px";
    if (this.ctx) this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  seed: function(){
    var margin = Math.min(104, Math.max(56, window.innerWidth * 0.07));
    this.drops = [];
    // Cuatro por lado: suficiente para leerlo como goteo, poco para el coste.
    for (var side = 0; side < 2; side++){
      for (var i = 0; i < 4; i++){
        this.drops.push({
          side: side,
          x: side === 0
            ? Math.random() * margin * 0.85 + 4
            : window.innerWidth - 4 - Math.random() * margin * 0.85,
          y: -Math.random() * window.innerHeight,
          speed: 0.5 + Math.random() * 1.6,
          length: 16 + Math.random() * 62,
          width: 1 + Math.random() * 1.9,
          alpha: 0.18 + Math.random() * 0.34
        });
      }
    }
  },

  frame: function(){
    var ctx = this.ctx;
    if (!ctx) return;
    var w = window.innerWidth;
    var h = window.innerHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#dc2626";

    for (var i = 0; i < this.drops.length; i++){
      var d = this.drops[i];
      d.y += d.speed * 2.4;
      d.speed = Math.min(3.4, d.speed + 0.004);

      var fade = Math.min(1, Math.max(0, (h - d.y) / (h * 0.35)));
      if (d.y > h || d.y < -d.length * 2){
        d.y = -d.length - Math.random() * h * 0.4;
        d.speed = 0.5 + Math.random() * 1.6;
        d.length = 16 + Math.random() * 62;
        d.x = d.side === 0
          ? Math.random() * (Math.min(104, Math.max(56, w * 0.07))) * 0.85 + 4
          : w - 4 - Math.random() * (Math.min(104, Math.max(56, w * 0.07))) * 0.85;
        continue;
      }

      ctx.globalAlpha = d.alpha * fade;

      // Cuerpo de la gota: se estrecha al caer.
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.width / 2, d.y + d.length);
      ctx.lineTo(d.x + d.width / 2, d.y + d.length);
      ctx.closePath();
      ctx.fill();

      // Cabeza redondeada.
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.width * 1.35, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    this.raf = requestAnimationFrame(this.frame.bind(this));
  },

  start: function(){
    if (this.running) return;
    this.running = true;
    this.canvas.hidden = false;
    if (!this.drops.length) this.seed();
    this.raf = requestAnimationFrame(this.frame.bind(this));
  },

  stop: function(){
    if (!this.running) return;
    this.running = false;
    cancelAnimationFrame(this.raf);
    if (this.ctx) this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    this.canvas.hidden = true;
    this.drops = [];
  },

  sync: function(){
    if (this.allowed()) this.start();
    else this.stop();
  }
};

/* ==========================================================================
   15. RELOJ
   ========================================================================== */
var clockNow = Date.now();

function tickClock(){
  clockNow = Date.now();
  state.now = clockNow;
  $("#clock").textContent = utcClock(clockNow) + " UTC";

  var items = $$("#ticker .ticker-item");
  if (items.length > 1){
    items[0].innerHTML = '<span class="live-dot"></span>Día ' + dayIndex() + ' de ' + DB.data.event.totalDays;
    items[items.length - 1].innerHTML = '<span class="ticker-value">' + utcClock(clockNow) + '</span><span class="ticker-dim">UTC</span>';
  }
}

var tickerInterval = setInterval(tickClock, 1000);
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden"){
    clearInterval(tickerInterval);
  } else {
    clockNow = Date.now();
    state.now = clockNow;
    tickerInterval = setInterval(tickClock, 1000);
  }
});

/* ==========================================================================
   16. ARRANQUE
   ========================================================================== */
DB.init();
blood.init();
route();
applyReveal(document);

/** Reaplica el revelado cuando cambia una vista, sin crear otro observador. */
var originalRender = render;
render = function(){
  originalRender();
  applyReveal(document);
};
render();
</script>
